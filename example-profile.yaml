# Example oci-to-wsl profile
#
# This file can be passed to oci-to-wsl with:
#   oci-to-wsl --profile example-profile.yaml

# WSL distribution name (must be unique on this machine).
name: my-ubuntu

# OCI image reference.  Any registry that requires authentication will be
# handled automatically – Azure Container Registry images open the default
# browser for an Azure AD interactive sign-in (no device-code copy/paste).
image: ubuntu:22.04

# Where to store the WSL virtual disk.  Defaults to .\<name> when omitted.
install_dir: C:\WSL\my-ubuntu

# Optional: files or folders to copy from the host into the new distribution
# before init_cmds run, so init scripts can use the copied content. Relative
# 'src' paths are resolved against the directory containing this profile.
# Windows %VAR% (e.g. %USERPROFILE%, %APPDATA%), POSIX $VAR / ${VAR} and a
# leading ~ are expanded in 'src'. Native Windows paths like C:\Users\me\file
# are accepted.
# 'mode' is optional and is applied with chmod after the copy (recursively for
# directories).
copies:
  - src: ./scripts/bootstrap.sh
    dst: /usr/local/bin/bootstrap.sh
    mode: "0755"
  - src: C:\Users\me\assets
    dst: /opt/assets
    mode: "0777"
  - src: '%USERPROFILE%\.ssh\id_rsa.pub'
    dst: /root/.ssh/authorized_keys
    mode: "0600"

# Optional: shell commands to run inside the new WSL instance after import.
init_cmds:
  - apt-get update -y
  - apt-get install -y curl git vim
