# Example oci-to-wsl profile
#
# This file can be passed to oci-to-wsl with:
#   oci-to-wsl --profile example-profile.yaml

# WSL distribution name (must be unique on this machine).
name: my-ubuntu

# OCI image reference.  Any registry that requires authentication will be
# handled automatically – Azure Container Registry images open the default
# browser for an Azure AD interactive sign-in (no device-code copy/paste).
image: ubuntu:22.04

# Where to store the WSL virtual disk.  Defaults to .\<name> when omitted.
install_dir: C:\WSL\my-ubuntu

# Optional: files or folders to stage into the new distribution by appending
# them to the rootfs tar before `wsl --import` runs, so they are present on
# first boot and visible to init_cmds. Relative 'src' paths are resolved
# against the directory containing this profile. Windows %VAR% (e.g.
# %USERPROFILE%, %APPDATA%), POSIX $VAR / ${VAR} and a leading ~ are expanded
# in 'src'. Native Windows paths like C:\Users\me\file are accepted. 'dst'
# must be an absolute POSIX path (start with '/'). 'mode' is optional and is
# baked into the tar header (no chmod step runs inside the distribution);
# for a directory source it applies recursively to all regular files.
copies:
  - src: ./scripts/bootstrap.sh
    dst: /usr/local/bin/bootstrap.sh
    mode: "0755"
  - src: C:\Users\me\assets
    dst: /opt/assets
    mode: "0777"
  - src: '%USERPROFILE%\.ssh\id_rsa.pub'
    dst: /root/.ssh/authorized_keys
    mode: "0600"

# Optional: absolute POSIX paths to remove from the rootfs tar before
# `wsl --import` runs. Files and directories are both supported; directories
# are removed recursively. Missing paths are silently ignored. Deletes are
# applied before `copies`, so you can drop an upstream directory and stage
# your own replacement at the same destination.
deletes:
  - /var/cache/apt
  - /etc/motd

# Optional: shell commands to run inside the new WSL instance after import.
# Each entry may be either a plain string (the command line) or a mapping
# with `cmd` and optional `env` keys. Values under `env` may reference
# Windows-side environment variables using %NAME% or $NAME / ${NAME} — those
# references are expanded at profile-load time against the oci-to-wsl
# process's environment, so a profile can forward host-side values like
# %USERNAME% or $USER into the new distribution. Unknown variables are
# preserved verbatim. The `cmd` string itself is NOT expanded by oci-to-wsl;
# it is forwarded as-is to the WSL shell, where normal shell substitution
# applies (so `echo "$host_user"` in `cmd` reads the env entry of the same
# name exported above).
init_cmds:
  - apt-get update -y
  - apt-get install -y curl git vim
  - cmd: |
      echo "imported by $host_user on $(date)" > /etc/oci-to-wsl.info
    env:
      - name: host_user
        value: $USER
  - cmd: id > /home/alice/whoami.txt
    run_as: alice                # run this command as the in-distro user `alice`
