name: E2E

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  e2e-wsl-import:
    name: Pull alpine and import into WSL
    runs-on: windows-latest
    env:
      # Force wsl.exe to emit UTF-8 instead of UTF-16 LE so PowerShell string
      # matching on its output works as expected.
      WSL_UTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl.exe .

      - name: Enable WSL
        shell: pwsh
        run: |
          # windows-latest runners ship with wsl.exe; make sure it is on PATH.
          wsl.exe --status
          wsl.exe --version

      - name: Import alpine:latest into WSL
        shell: pwsh
        run: |
          $installDir = Join-Path $PWD 'wsl-e2e-alpine'
          Write-Host "Install dir: $installDir"
          .\oci-to-wsl.exe --image alpine:latest --name e2e-alpine --dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "oci-to-wsl failed with exit code $LASTEXITCODE" }
          Write-Host "--- install dir contents ---"
          Get-ChildItem -Force $installDir | Format-Table -AutoSize

      - name: Verify the distribution was created
        shell: pwsh
        run: |
          Write-Host "--- wsl --list --verbose ---"
          wsl.exe --list --verbose
          Write-Host "--- wsl --list --quiet ---"
          $list = wsl.exe --list --quiet
          Write-Host $list
          if ($list -notmatch 'e2e-alpine') { throw "e2e-alpine distribution not found" }

      - name: Start the imported distribution
        shell: pwsh
        run: |
          # Explicitly boot the distro so the first verification command does
          # not race with WSL's VM startup / rootfs mount.
          wsl.exe -d e2e-alpine --user root --exec /bin/true
          if ($LASTEXITCODE -ne 0) { throw "failed to start e2e-alpine (exit=$LASTEXITCODE)" }
          Write-Host "--- wsl --list --verbose (after start) ---"
          wsl.exe --list --verbose

      - name: Run commands inside the imported distribution
        shell: pwsh
        run: |
          Write-Host "--- ls -la / inside the distro ---"
          wsl.exe -d e2e-alpine --user root --exec /bin/ls -la / 2>&1 | Out-Host
          Write-Host "(exit=$LASTEXITCODE)"

          $release = wsl.exe -d e2e-alpine --user root --exec /bin/cat /etc/alpine-release
          if ($LASTEXITCODE -ne 0) { throw "failed to read /etc/alpine-release" }
          Write-Host "alpine-release: $release"
          if ([string]::IsNullOrWhiteSpace($release)) { throw "/etc/alpine-release was empty" }

          $uname = wsl.exe -d e2e-alpine --user root --exec /bin/uname -a
          if ($LASTEXITCODE -ne 0) { throw "uname failed" }
          Write-Host "uname: $uname"

          $hello = wsl.exe -d e2e-alpine --user root -- sh -c "echo hello-from-wsl"
          if ($LASTEXITCODE -ne 0) { throw "sh -c failed" }
          if ($hello -notmatch 'hello-from-wsl') { throw "unexpected output: $hello" }

      - name: Tear down the test distribution
        if: always()
        shell: pwsh
        run: |
          wsl.exe --unregister e2e-alpine
          if ($LASTEXITCODE -ne 0) { Write-Host "unregister failed (non-fatal)" }

  e2e-docker-daemon:
    name: Load alpine from local docker daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl .

      - name: Ensure docker is running and seed an image only present locally
        run: |
          docker version
          # Build an image with a tag that does not exist in any registry so
          # the test fails if oci-to-wsl falls back to a registry pull instead
          # of using the local docker daemon as expected.
          docker pull alpine:latest
          docker tag alpine:latest oci-to-wsl-e2e/local-only:notpublished
          docker image inspect oci-to-wsl-e2e/local-only:notpublished >/dev/null

      - name: Export rootfs tar from docker daemon (auto-detected)
        run: |
          ./oci-to-wsl --image oci-to-wsl-e2e/local-only:notpublished --save-tar alpine-docker.tar
          ls -lh alpine-docker.tar

      - name: Verify exported rootfs tar looks like an alpine rootfs
        run: |
          # The flattened rootfs tar should contain the usual top-level dirs
          # and /etc/alpine-release. Use tar -tf to inspect without extracting.
          tar -tf alpine-docker.tar | head -50
          if ! tar -tf alpine-docker.tar | grep -qE '(^|/)etc/alpine-release$'; then
            echo "etc/alpine-release missing from rootfs tar"
            exit 1
          fi
          # Extract and read alpine-release to make sure the file is non-empty.
          mkdir rootfs-docker
          tar -xf alpine-docker.tar -C rootfs-docker ./etc/alpine-release 2>/dev/null || \
            tar -xf alpine-docker.tar -C rootfs-docker etc/alpine-release
          test -s rootfs-docker/etc/alpine-release
          echo "alpine-release: $(cat rootfs-docker/etc/alpine-release)"

      - name: Verify OCI_TO_WSL_NO_LOCAL bypasses the local daemon
        env:
          OCI_TO_WSL_NO_LOCAL: "1"
        run: |
          # With the local lookup disabled, the registry path is forced. The
          # local-only image does not exist on any registry, so the command
          # must fail.
          if ./oci-to-wsl --image oci-to-wsl-e2e/local-only:notpublished --save-tar should-not-exist.tar; then
            echo "expected failure when OCI_TO_WSL_NO_LOCAL=1 forces a registry pull of a local-only image"
            exit 1
          fi
          # Sanity check: with the flag on, pulling a real registry image
          # should still work.
          ./oci-to-wsl --image alpine:latest --save-tar alpine-registry.tar
          test -s alpine-registry.tar
