name: E2E

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  e2e-windows:
    name: WSL end-to-end (Go test runner)
    runs-on: windows-latest
    env:
      # Force wsl.exe to emit UTF-8 instead of UTF-16 LE so output captured
      # by the Go test runner is decodable as plain UTF-8.
      WSL_UTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl.exe .

      - name: Show WSL status
        shell: pwsh
        run: |
          wsl.exe --status
          wsl.exe --version

      - name: Run end-to-end test suite
        shell: pwsh
        env:
          # Point the e2e tests at the binary we just built. The test
          # runner requires OCI_TO_WSL_BIN and does not build the binary
          # itself.
          OCI_TO_WSL_BIN: ${{ github.workspace }}\oci-to-wsl.exe
        run: |
          go test -tags=e2e -timeout 30m -v -run TestE2E .

      - name: Tear down leftover test distributions
        if: always()
        shell: pwsh
        run: |
          foreach ($d in @('e2e-alpine','e2e-copy')) {
            wsl.exe --unregister $d 2>$null
          }
          exit 0

  e2e-docker-daemon:
    name: Load alpine from local docker daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl .

      - name: Ensure docker is running and seed an image only present locally
        run: |
          docker version
          # Build an image with a tag that does not exist in any registry so
          # the test fails if oci-to-wsl falls back to a registry pull instead
          # of using the local docker daemon as expected.
          docker pull alpine:latest
          docker tag alpine:latest oci-to-wsl-e2e/local-only:notpublished
          docker image inspect oci-to-wsl-e2e/local-only:notpublished >/dev/null

      - name: Export rootfs tar from docker daemon (auto-detected)
        run: |
          ./oci-to-wsl --image oci-to-wsl-e2e/local-only:notpublished --save-tar alpine-docker.tar
          ls -lh alpine-docker.tar

      - name: Verify exported rootfs tar looks like an alpine rootfs
        run: |
          # The flattened rootfs tar should contain the usual top-level dirs
          # and /etc/alpine-release. Use tar -tf to inspect without extracting.
          tar -tf alpine-docker.tar | head -50
          if ! tar -tf alpine-docker.tar | grep -qE '(^|/)etc/alpine-release$'; then
            echo "etc/alpine-release missing from rootfs tar"
            exit 1
          fi
          # Extract and read alpine-release to make sure the file is non-empty.
          mkdir rootfs-docker
          tar -xf alpine-docker.tar -C rootfs-docker ./etc/alpine-release 2>/dev/null || \
            tar -xf alpine-docker.tar -C rootfs-docker etc/alpine-release
          test -s rootfs-docker/etc/alpine-release
          echo "alpine-release: $(cat rootfs-docker/etc/alpine-release)"

      - name: Verify OCI_TO_WSL_NO_LOCAL bypasses the local daemon
        env:
          OCI_TO_WSL_NO_LOCAL: "1"
        run: |
          # With the local lookup disabled, the registry path is forced. The
          # local-only image does not exist on any registry, so the command
          # must fail.
          if ./oci-to-wsl --image oci-to-wsl-e2e/local-only:notpublished --save-tar should-not-exist.tar; then
            echo "expected failure when OCI_TO_WSL_NO_LOCAL=1 forces a registry pull of a local-only image"
            exit 1
          fi
          # Sanity check: with the flag on, pulling a real registry image
          # should still work.
          ./oci-to-wsl --image alpine:latest --save-tar alpine-registry.tar
          test -s alpine-registry.tar

  e2e-save-tar-no-tar-mods:
    name: save-tar honours OCI_TO_WSL_NO_TAR_MODS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl .

      - name: Prepare profile with copies and deletes
        run: |
          mkdir -p e2e-no-tar-mods/assets
          echo 'hello-from-host' > e2e-no-tar-mods/assets/marker.txt
          cat > e2e-no-tar-mods/profile.yaml <<'YAML'
          name: e2e-no-tar-mods
          image: alpine:latest
          copies:
            - src: ./assets/marker.txt
              dst: /opt/marker.txt
              mode: "0644"
          deletes:
            - /etc/issue
          YAML
          cat e2e-no-tar-mods/profile.yaml

      - name: Default --save-tar bakes copies and deletes into the tar
        run: |
          ./oci-to-wsl --profile e2e-no-tar-mods/profile.yaml --save-tar default.tar
          test -s default.tar
          # The copied marker file must be present.
          if ! tar -tf default.tar | grep -qE '(^|/)opt/marker\.txt$'; then
            echo "opt/marker.txt missing from default tar (copies were not applied)"
            tar -tf default.tar | head -50
            exit 1
          fi
          # The deleted /etc/issue must be absent.
          if tar -tf default.tar | grep -qE '(^|/)etc/issue$'; then
            echo "etc/issue still present in default tar (deletes were not applied)"
            exit 1
          fi
          # Verify the content of the copied marker file.
          mkdir default-rootfs
          tar -xf default.tar -C default-rootfs ./opt/marker.txt 2>/dev/null || \
            tar -xf default.tar -C default-rootfs opt/marker.txt
          grep -q 'hello-from-host' default-rootfs/opt/marker.txt

      - name: OCI_TO_WSL_NO_TAR_MODS=1 skips copies and deletes
        env:
          OCI_TO_WSL_NO_TAR_MODS: "1"
        run: |
          ./oci-to-wsl --profile e2e-no-tar-mods/profile.yaml --save-tar raw.tar 2> raw.stderr
          test -s raw.tar
          echo "--- stderr ---"
          cat raw.stderr
          # The skip notice must always be visible on stderr (it bypasses slog
          # filtering on purpose).
          if ! grep -q 'OCI_TO_WSL_NO_TAR_MODS is set' raw.stderr; then
            echo "expected skip notice on stderr"
            exit 1
          fi
          # The copied marker file must NOT be present.
          if tar -tf raw.tar | grep -qE '(^|/)opt/marker\.txt$'; then
            echo "opt/marker.txt unexpectedly present in raw tar (copies should be skipped)"
            exit 1
          fi
          # The deleted /etc/issue must still be there.
          if ! tar -tf raw.tar | grep -qE '(^|/)etc/issue$'; then
            echo "etc/issue missing from raw tar (deletes should be skipped)"
            tar -tf raw.tar | head -50
            exit 1
          fi
