name: E2E

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# All scenario logic lives in the table-driven Go runners (TestE2E /
# TestE2EDockerDaemon, both guarded by `//go:build e2e`). Each job below
# is intentionally a baseline of "build the binary, point the runner at
# it, run `go test -tags=e2e`" — adding or removing scenarios should not
# require touching this file.

jobs:
  e2e-windows:
    name: WSL end-to-end (Go test runner)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl.exe .

      - name: Run end-to-end test suite
        shell: pwsh
        env:
          # Point the e2e tests at the binary we just built. The test
          # runner requires OCI_TO_WSL_BIN and does not build the binary
          # itself.
          OCI_TO_WSL_BIN: ${{ github.workspace }}\oci-to-wsl.exe
        run: |
          go test -tags=e2e -timeout 30m -v .

  e2e-linux:
    name: Linux end-to-end (Go test runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl .

      - name: Run end-to-end test suite
        env:
          OCI_TO_WSL_BIN: ${{ github.workspace }}/oci-to-wsl
        run: |
          go test -tags=e2e -timeout 30m -v .
