name: E2E

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  e2e-save-tar:
    name: Pull alpine and export rootfs tar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl .

      - name: Pull alpine:latest and save rootfs tar
        run: |
          ./oci-to-wsl --image alpine:latest --save-tar alpine-rootfs.tar

      - name: Verify exported rootfs tar
        run: |
          set -euo pipefail
          test -s alpine-rootfs.tar
          ls -lh alpine-rootfs.tar
          # Sanity check: the tar should contain a typical Alpine rootfs layout.
          tar -tf alpine-rootfs.tar | head -n 50
          tar -tf alpine-rootfs.tar | grep -E '(^|/)bin/(busybox|sh)$' >/dev/null
          tar -tf alpine-rootfs.tar | grep -E '(^|/)etc/alpine-release$' >/dev/null

      - name: Upload rootfs tar
        uses: actions/upload-artifact@v4
        with:
          name: alpine-rootfs
          path: alpine-rootfs.tar
          if-no-files-found: error
          retention-days: 7
