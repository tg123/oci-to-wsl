name: E2E

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  e2e-windows:
    name: WSL end-to-end (Go test runner)
    runs-on: windows-latest
    env:
      # Force wsl.exe to emit UTF-8 instead of UTF-16 LE so output captured
      # by the Go test runner is decodable as plain UTF-8.
      WSL_UTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl.exe .

      - name: Show WSL status
        shell: pwsh
        run: |
          wsl.exe --status
          wsl.exe --version

      - name: Run end-to-end test suite
        shell: pwsh
        env:
          # Point the e2e tests at the binary we just built. The test
          # runner requires OCI_TO_WSL_BIN and does not build the binary
          # itself.
          OCI_TO_WSL_BIN: ${{ github.workspace }}\oci-to-wsl.exe
        run: |
          go test -tags=e2e -timeout 30m -v -run TestE2E .

      - name: Tear down leftover test distributions
        if: always()
        shell: pwsh
        run: |
          foreach ($d in @('e2e-alpine','e2e-copy')) {
            wsl.exe --unregister $d 2>$null
          }
          exit 0

  e2e-wsl-conf:
    name: Profile wsl_conf merge + env var expansion
    runs-on: windows-latest
    env:
      WSL_UTF8: "1"
      # Consumed by %WSL_CONF_E2E_USER% in the profile below to prove host
      # env vars are expanded into wsl_conf.content at profile-load time.
      WSL_CONF_E2E_USER: "alice"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl.exe .

      - name: Enable WSL
        shell: pwsh
        run: |
          wsl.exe --status
          wsl.exe --version

      - name: Prepare profile with wsl_conf (merge mode + env expansion)
        shell: pwsh
        run: |
          $work = Join-Path $PWD 'e2e-wslconf'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          # alpine:latest does not ship /etc/wsl.conf, so merge effectively
          # writes a fresh file. The [user] section uses %WSL_CONF_E2E_USER%
          # which must be expanded to "alice" by ExpandEnvVars at load time.
          $profile = @'
          name: e2e-wslconf
          image: alpine:latest
          wsl_conf:
            mode: merge
            content: |
              [boot]
              systemd=false
              [user]
              default=%WSL_CONF_E2E_USER%
              [interop]
              appendWindowsPath=false
          '@
          Set-Content -Path (Join-Path $work 'profile.yaml') -Value $profile
          Get-Content (Join-Path $work 'profile.yaml')

      - name: Import with wsl_conf profile
        shell: pwsh
        run: |
          $work = Join-Path $PWD 'e2e-wslconf'
          $installDir = Join-Path $PWD 'wsl-e2e-wslconf'
          .\oci-to-wsl.exe --profile (Join-Path $work 'profile.yaml') --dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "oci-to-wsl failed with exit code $LASTEXITCODE" }

      - name: Verify /etc/wsl.conf content (env var expanded, sections written)
        shell: pwsh
        run: |
          $conf = wsl.exe -d e2e-wslconf --user root --exec /bin/cat /etc/wsl.conf
          if ($LASTEXITCODE -ne 0) { throw "cat /etc/wsl.conf failed" }
          $confStr = ($conf | Out-String)
          Write-Host "--- /etc/wsl.conf ---"
          Write-Host $confStr
          Write-Host "---------------------"

          # The host env var %WSL_CONF_E2E_USER% must have been expanded to
          # the literal "alice". The unexpanded token must NOT appear.
          if ($confStr -notmatch 'default\s*=\s*alice') {
            throw "default=alice not found - env var was not expanded: $confStr"
          }
          if ($confStr -match 'WSL_CONF_E2E_USER') {
            throw "unexpanded %WSL_CONF_E2E_USER% found in /etc/wsl.conf: $confStr"
          }

          # Sanity-check the other sections we wrote made it through too.
          if ($confStr -notmatch '\[boot\]') { throw "[boot] section missing: $confStr" }
          if ($confStr -notmatch 'systemd\s*=\s*false') { throw "systemd=false missing: $confStr" }
          if ($confStr -notmatch '\[interop\]') { throw "[interop] section missing: $confStr" }
          if ($confStr -notmatch 'appendWindowsPath\s*=\s*false') { throw "appendWindowsPath=false missing: $confStr" }

      - name: Tear down the test distribution
        if: always()
        shell: pwsh
        run: |
          wsl.exe --unregister e2e-wslconf
          if ($LASTEXITCODE -ne 0) { Write-Host "unregister failed (non-fatal)" }

  e2e-wsl-conf-yaml-native:
    name: Profile wsl_conf YAML-native sections
    runs-on: windows-latest
    env:
      WSL_UTF8: "1"
      WSL_CONF_E2E_USER: "alice"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl.exe .

      - name: Enable WSL
        shell: pwsh
        run: |
          wsl.exe --status
          wsl.exe --version

      - name: Prepare profile with wsl_conf YAML-native sections
        shell: pwsh
        run: |
          $work = Join-Path $PWD 'e2e-wslconf-yaml'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          # Same effective config as the raw-INI e2e job, but expressed as
          # YAML-native nested maps. Validates that any top-level key under
          # wsl_conf other than mode/content is treated as a section, and
          # that env-var expansion runs over the rendered INI.
          $profile = @'
          name: e2e-wslconf-yaml
          image: alpine:latest
          wsl_conf:
            mode: merge
            boot:
              systemd: false
            user:
              default: "%WSL_CONF_E2E_USER%"
            interop:
              appendWindowsPath: false
          '@
          Set-Content -Path (Join-Path $work 'profile.yaml') -Value $profile
          Get-Content (Join-Path $work 'profile.yaml')

      - name: Import with wsl_conf YAML-native profile
        shell: pwsh
        run: |
          $work = Join-Path $PWD 'e2e-wslconf-yaml'
          $installDir = Join-Path $PWD 'wsl-e2e-wslconf-yaml'
          .\oci-to-wsl.exe --profile (Join-Path $work 'profile.yaml') --dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "oci-to-wsl failed with exit code $LASTEXITCODE" }

      - name: Verify /etc/wsl.conf content (YAML-native sections, env var expanded)
        shell: pwsh
        run: |
          $conf = wsl.exe -d e2e-wslconf-yaml --user root --exec /bin/cat /etc/wsl.conf
          if ($LASTEXITCODE -ne 0) { throw "cat /etc/wsl.conf failed" }
          $confStr = ($conf | Out-String)
          Write-Host "--- /etc/wsl.conf ---"
          Write-Host $confStr
          Write-Host "---------------------"

          if ($confStr -notmatch 'default\s*=\s*alice') {
            throw "default=alice not found - env var was not expanded: $confStr"
          }
          if ($confStr -match 'WSL_CONF_E2E_USER') {
            throw "unexpanded %WSL_CONF_E2E_USER% found in /etc/wsl.conf: $confStr"
          }
          if ($confStr -notmatch '\[boot\]') { throw "[boot] section missing: $confStr" }
          if ($confStr -notmatch 'systemd\s*=\s*false') { throw "systemd=false missing: $confStr" }
          if ($confStr -notmatch '\[interop\]') { throw "[interop] section missing: $confStr" }
          if ($confStr -notmatch 'appendWindowsPath\s*=\s*false') { throw "appendWindowsPath=false missing: $confStr" }

      - name: Tear down the test distribution
        if: always()
        shell: pwsh
        run: |
          wsl.exe --unregister e2e-wslconf-yaml
          if ($LASTEXITCODE -ne 0) { Write-Host "unregister failed (non-fatal)" }

  e2e-docker-daemon:
    name: Load alpine from local docker daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build oci-to-wsl
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o oci-to-wsl .

      - name: Ensure docker is running and seed an image only present locally
        run: |
          docker version
          # Build an image with a tag that does not exist in any registry so
          # the test fails if oci-to-wsl falls back to a registry pull instead
          # of using the local docker daemon as expected.
          docker pull alpine:latest
          docker tag alpine:latest oci-to-wsl-e2e/local-only:notpublished
          docker image inspect oci-to-wsl-e2e/local-only:notpublished >/dev/null

      - name: Export rootfs tar from docker daemon (auto-detected)
        run: |
          ./oci-to-wsl --image oci-to-wsl-e2e/local-only:notpublished --save-tar alpine-docker.tar
          ls -lh alpine-docker.tar

      - name: Verify exported rootfs tar looks like an alpine rootfs
        run: |
          # The flattened rootfs tar should contain the usual top-level dirs
          # and /etc/alpine-release. Use tar -tf to inspect without extracting.
          tar -tf alpine-docker.tar | head -50
          if ! tar -tf alpine-docker.tar | grep -qE '(^|/)etc/alpine-release$'; then
            echo "etc/alpine-release missing from rootfs tar"
            exit 1
          fi
          # Extract and read alpine-release to make sure the file is non-empty.
          mkdir rootfs-docker
          tar -xf alpine-docker.tar -C rootfs-docker ./etc/alpine-release 2>/dev/null || \
            tar -xf alpine-docker.tar -C rootfs-docker etc/alpine-release
          test -s rootfs-docker/etc/alpine-release
          echo "alpine-release: $(cat rootfs-docker/etc/alpine-release)"

      - name: Verify OCI_TO_WSL_NO_LOCAL bypasses the local daemon
        env:
          OCI_TO_WSL_NO_LOCAL: "1"
        run: |
          # With the local lookup disabled, the registry path is forced. The
          # local-only image does not exist on any registry, so the command
          # must fail.
          if ./oci-to-wsl --image oci-to-wsl-e2e/local-only:notpublished --save-tar should-not-exist.tar; then
            echo "expected failure when OCI_TO_WSL_NO_LOCAL=1 forces a registry pull of a local-only image"
            exit 1
          fi
          # Sanity check: with the flag on, pulling a real registry image
          # should still work.
          ./oci-to-wsl --image alpine:latest --save-tar alpine-registry.tar
          test -s alpine-registry.tar
